<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Convite — Marcela Lima | XV Anos</title>
  <meta name="description" content="Convite especial — Marcela Lima XV Anos" />
  <meta property="og:title" content="Convite — Marcela Lima | XV Anos" />
  <meta property="og:description" content="Toque para assistir ao convite." />
  <meta property="og:type" content="website" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    video {
      width: 100vw;
      height: 100dvh;
      display: block;
      object-fit: cover;
      background: #000;
    }

    @media (min-width: 768px) {
      video {
        object-fit: contain;
      }
    }

    .sound-hint {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      font-size: 13px;
      letter-spacing: 0.02em;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      white-space: nowrap;
      z-index: 10;
    }

    .sound-hint.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <video
    id="convite-video"
    src="./convite.mp4"
    autoplay
    muted
    playsinline
    controls
    preload="auto"
  ></video>

  <div id="sound-hint" class="sound-hint">Toque na tela para ativar o som</div>

  <script>
    const video = document.getElementById("convite-video");
    const soundHint = document.getElementById("sound-hint");

    function syncHint() {
      soundHint.classList.toggle("visible", video.muted);
    }

    async function startVideo() {
      try {
        video.muted = false;
        video.volume = 1;
        await video.play();
      } catch {
        video.muted = true;
        video.play().catch(() => {});
      }
      syncHint();
    }

    function unmuteOnInteraction(e) {
      if (video.muted) {
        video.muted = false;
        video.volume = 1;
        syncHint();
      }

      const rect = video.getBoundingClientRect();
      const inControlsBar = e.clientY > rect.bottom - 56;
      if (!inControlsBar && video.paused) {
        video.play().catch(() => {});
      }
    }

    window.addEventListener("DOMContentLoaded", startVideo);
    video.addEventListener("volumechange", syncHint);
    document.addEventListener("pointerdown", unmuteOnInteraction, { passive: true });
    document.addEventListener("click", unmuteOnInteraction);
  </script>
</body>
</html>
