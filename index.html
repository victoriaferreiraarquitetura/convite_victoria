<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Convite — Marcela Lima | XV Anos</title>
  <meta name="description" content="Convite especial — Marcela Lima XV Anos" />
  <meta property="og:title" content="Convite — Marcela Lima | XV Anos" />
  <meta property="og:description" content="Toque para assistir ao convite." />
  <meta property="og:type" content="website" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100vw;
      height: 100dvh;
      display: block;
      object-fit: cover;
      background: #000;
    }

    @media (min-width: 768px) {
      video {
        object-fit: contain;
      }
    }
  </style>
</head>
<body>
  <video
    id="convite-video"
    src="./convite.mp4"
    autoplay
    muted
    playsinline
    controls
    preload="auto"
  ></video>

  <script>
    const video = document.getElementById("convite-video");

    async function startVideo() {
      try {
        video.muted = false;
        await video.play();
      } catch {
        video.muted = true;
        video.play().catch(() => {});
      }
    }

    window.addEventListener("DOMContentLoaded", startVideo);

    video.addEventListener("click", (e) => {
      const rect = video.getBoundingClientRect();
      const inControlsBar = e.clientY > rect.bottom - 56;

      if (video.muted) {
        video.muted = false;
      }

      if (!inControlsBar && video.paused) {
        video.play().catch(() => {});
      }
    });
  </script>
</body>
</html>
