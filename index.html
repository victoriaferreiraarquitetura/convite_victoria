<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Convite — Marcela Lima | XV Anos</title>
  <meta name="description" content="Convite especial — Marcela Lima XV Anos" />
  <meta property="og:title" content="Convite — Marcela Lima | XV Anos" />
  <meta property="og:description" content="Toque para assistir ao convite." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0b10;
      --surface: #15131c;
      --gold: #d9be8b;
      --text: #f5f2eb;
      --muted: rgba(245, 242, 235, 0.65);
      --border: rgba(217, 190, 139, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 0%, rgba(217, 190, 139, 0.12), transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(120, 95, 160, 0.1), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 28px;
      gap: 16px;
    }

    .header {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500;
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: clamp(1.75rem, 4.5vw, 2.4rem);
      letter-spacing: 0.03em;
      line-height: 1.1;
    }

    .player-wrap {
      position: relative;
      width: min(100%, 420px);
      aspect-ratio: 9 / 16;
      max-height: 78dvh;
      border-radius: 18px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.65),
        0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(12, 11, 16, 0.35);
      border: 0;
      color: var(--text);
      cursor: pointer;
      transition: opacity 0.25s ease, background 0.25s ease;
    }

    .play-overlay:hover {
      background: rgba(12, 11, 16, 0.22);
    }

    .play-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .play-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(217, 190, 139, 0.92);
      color: #121016;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      transition: transform 0.2s ease;
    }

    .play-overlay:hover .play-btn {
      transform: scale(1.06);
    }

    .play-label {
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .hint {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <header class="header">
      <span class="eyebrow">XV Anos</span>
      <h1>Marcela Lima</h1>
    </header>

    <div class="player-wrap">
      <video
        id="convite-video"
        src="./convite.mp4"
        controls
        playsinline
        preload="metadata"
      ></video>

      <button class="play-overlay" id="play-overlay" type="button" aria-label="Assistir convite">
        <span class="play-btn" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.8-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z" />
          </svg>
        </span>
        <span class="play-label">Assistir convite</span>
      </button>
    </div>

    <p class="hint">Ative o som do aparelho para a melhor experiência.</p>
  </main>

  <script>
    const video = document.getElementById("convite-video");
    const overlay = document.getElementById("play-overlay");

    overlay.addEventListener("click", () => {
      video.play().catch(() => {});
    });

    video.addEventListener("play", () => {
      overlay.classList.add("hidden");
    });

    video.addEventListener("ended", () => {
      overlay.classList.remove("hidden");
    });
  </script>
</body>
</html>
